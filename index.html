<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Notes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>Notes</h1>
                <button id="newNoteBtn" title="New Note">+</button>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search notes...">
            </div>
            <div id="notesList" class="notes-list"></div>
            <div class="sidebar-footer">
                <span id="noteCount">0 notes</span>
            </div>
        </aside>

        <main class="editor-area">
            <div id="emptyState" class="empty-state">
                <div class="empty-icon">&#128221;</div>
                <h2>No Note Selected</h2>
                <p>Select a note from the sidebar or create a new one to get started</p>
            </div>

            <div id="editorContainer" class="editor-container" style="display: none;">
                <div class="editor-toolbar">
                    <input type="text" id="noteTitle" class="note-title-input" placeholder="Note title...">
                    <div class="toolbar-actions">
                        <button id="togglePreview" class="toolbar-btn" title="Toggle Preview">Preview</button>
                        <button id="deleteNote" class="toolbar-btn danger" title="Delete Note">Delete</button>
                    </div>
                </div>

                <div class="editor-body">
                    <div id="editorPane" class="pane">
                        <textarea id="markdownInput" placeholder="Write your notes in Markdown..."></textarea>
                    </div>
                    <div id="previewPane" class="pane preview-pane" style="display: none;">
                        <div id="previewContent" class="preview-content"></div>
                    </div>
                </div>

                <div class="editor-status">
                    <span id="charCount">0 characters</span>
                    <span id="lastSaved">Not saved yet</span>
                </div>
            </div>
        </main>
    </div>

    <script src="marked.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
